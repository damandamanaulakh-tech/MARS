<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none"
          stroke="url(#steel)" stroke-width="13"/>
  <!-- Splayed A: apex top, legs out to wide base -->
  <path d="M 100 25 L 168 175 M 100 25 L 32 175"
        stroke="url(#steel)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Signature swoosh: replaces the A's crossbar.
       Starts under the left leg, curls down, sweeps right past the centre,
       comes up the right side, exits near the right shoulder. -->
  <path d="M 38 170
           C 26 145 38 122 70 122
           C 100 122 130 132 156 122
           C 178 114 178 90 168 70"
        stroke="url(#steel)" stroke-width="11"
        stroke-linecap="round" fill="none"/>
</svg>
