{% extends "base.html" %}
{% block title %}{{ title }} — Sourceborn AM07{% endblock %}
{% block content %}
<div class="text-xs tracking-widest text-ink-faint uppercase mb-3">{{ eyebrow }}</div>
<h1 class="font-black text-5xl tracking-tight">{{ title }}</h1>
<p class="text-ink-soft mt-3 max-w-xl">{{ subtitle }}</p>
<div class="mt-12 bg-white border border-line p-10 text-center text-ink-faint">
  <div class="text-5xl mb-3">{{ emoji }}</div>
  <div class="font-semibold text-ink">Coming in Phase 2.</div>
  <div class="text-sm mt-2">{{ note }}</div>
</div>
{% endblock %}
