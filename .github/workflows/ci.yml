name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest openpyxl
      - name: Run tests
        run: python -m pytest trading/tests/ web/tests/ -q -ra --junitxml=pytest-results.xml
      - name: Require every collected test to run
        run: python -c "import xml.etree.ElementTree as ET; skipped = ET.parse('pytest-results.xml').findall('.//testcase/skipped'); assert not skipped, f'{len(skipped)} tests skipped; see pytest summary for missing prerequisites'"
