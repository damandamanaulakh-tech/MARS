name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

jobs:
  repair-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backlog retention and evidence links
        run: python scripts/check_repair_records.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest openpyxl
      - name: Run tests
        run: python -m pytest trading/tests/ web/tests/ -q -ra --junitxml=pytest-results.xml
      - name: Require every collected test to run
        run: python -c "import xml.etree.ElementTree as ET; skipped = ET.parse('pytest-results.xml').findall('.//testcase/skipped'); assert not skipped, f'{len(skipped)} tests skipped; see pytest summary for missing prerequisites'"
      - name: Reproduce frozen Goal08 research without network or settings writes
        run: python -m research.profit_protection_2026_11_16.study verify
      - name: Verify Goal08 report matches the sealed measurements
        run: python -m research.profit_protection_2026_11_16.report --check
  reentry-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: research/reentry_2026_11_16/requirements.txt
      - name: Install the original Goal09 numerical runtime
        run: pip install -r research/reentry_2026_11_16/requirements.txt
      - name: Require the recorded interpreter and numerical package versions
        run: python -c "import json, platform, importlib.metadata as m; r=json.load(open('research/reentry_2026_11_16/runtime.json')); assert platform.python_implementation()==r['implementation']; assert platform.python_version()==r['python']; assert all(m.version(k)==v for k,v in r['packages'].items())"
      - name: Reproduce frozen Goal09 re-entry decisions and loss-recovery attribution
        run: python -m research.reentry_2026_11_16.study verify
      - name: Verify Goal09 report matches the sealed measurements
        run: python -m research.reentry_2026_11_16.report --check
  sizing-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: research/sizing_2026_11_16/requirements.txt
      - name: Install the frozen Goal10 numerical runtime
        run: pip install -r research/sizing_2026_11_16/requirements.txt
      - name: Reproduce Goal10 sizes, net losses, costs and unseen holdout
        run: python -m research.sizing_2026_11_16.study verify
      - name: Verify Goal10 report and every comparison row
        run: python -m research.sizing_2026_11_16.report --check
