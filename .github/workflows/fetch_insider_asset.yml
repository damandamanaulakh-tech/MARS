# One-shot utility: pull insider_pit.csv (18MB, over the session Drive cap)
# from the chityy-archive release into data/, hash-verified. Deleted after use.
name: fetch-insider-asset
on:
  push:
    branches: [claude/repo-audit-overview-epyrvc]
    paths: ['.github/workflows/fetch_insider_asset.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download chityy-archive --pattern insider_pit.csv --dir data/ --repo "$GITHUB_REPOSITORY"
          size=$(wc -c < data/insider_pit.csv)
          hash=$(sha256sum data/insider_pit.csv | cut -c1-16)
          echo "size=$size hash=$hash"
          test "$size" = "18146761"
          test "$hash" = "e97e6c36f5fb021e"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insider_pit.csv
          git commit -m "Colab v2 intake: insider_pit.csv from chityy-archive release (sha256_16 e97e6c36f5fb021e verified in-workflow)"
          for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break || sleep 5; done
